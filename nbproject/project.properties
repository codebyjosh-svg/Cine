annotation.processing.enabled=true
annotation.processing.enabled.in.editor=false
annotation.processing.processors.list=
annotation.processing.run.all.processors=true
annotation.processing.source.output=${build.generated.sources.dir}/ap-source-output

application.title=Cinema
application.vendor=Usuario

auxiliary.org-netbeans-spi-editor-hints-projects.perProjectHintSettingsFile=nbproject/cfg_hints.xml

compile.on.save=false

build.classes.dir=${build.dir}/classes
build.classes.excludes=**/*.java,**/*.form
build.dir=build
build.generated.dir=${build.dir}/generated
build.generated.sources.dir=${build.dir}/generated-sources
build.sysclasspath=ignore
build.test.classes.dir=${build.dir}/test/classes
build.test.results.dir=${build.dir}/test/results

debug.classpath=\
    ${run.classpath}

debug.modulepath=\
    ${run.modulepath}

debug.test.classpath=\
    ${run.test.classpath}

debug.test.modulepath=\
    ${run.test.modulepath}

dist.archive.excludes=
dist.dir=dist
dist.jar=${dist.dir}/Cinema.jar
dist.javadoc.dir=${dist.dir}/javadoc
dist.jlink.dir=${dist.dir}/jlink
dist.jlink.output=${dist.jlink.dir}/Cinema

endorsed.classpath=

excludes=
includes=**

jar.archive.disabled=${jnlp.enabled}
jar.compress=false
jar.index=${jnlp.enabled}

# =========================================================
# JAVA 21 + JAVAFX 21 + MYSQL
# =========================================================

javafx.lib.dir=C:/javafx-sdk-21.0.11/lib

javac.classpath=\
    ${libs.MySQL_Connector_8.classpath}:\
    ${libs.absolutelayout.classpath}

javac.compilerargs=--add-modules javafx.controls,javafx.fxml
javac.deprecation=false
javac.external.vm=true

javac.modulepath=${javafx.lib.dir}

javac.processormodulepath=

javac.processorpath=\
    ${javac.classpath}

javac.source=21
javac.target=21

javac.test.classpath=\
    ${javac.classpath}:\
    ${build.classes.dir}

javac.test.modulepath=\
    ${javac.modulepath}

javac.test.processorpath=\
    ${javac.test.classpath}

# =========================================================
# JAVADOC
# =========================================================

javadoc.additionalparam=
javadoc.author=false
javadoc.encoding=${source.encoding}
javadoc.html5=false
javadoc.noindex=false
javadoc.nonavbar=false
javadoc.notree=false
javadoc.private=false
javadoc.splitindex=true
javadoc.use=true
javadoc.version=false
javadoc.windowtitle=

# =========================================================
# JLINK
# =========================================================

jlink.additionalmodules=
jlink.additionalparam=
jlink.launcher=true
jlink.launcher.name=Cinema

# =========================================================
# JAVA WEB START / JNLP
# =========================================================

jnlp.codebase.type=no.codebase
jnlp.descriptor=application
jnlp.enabled=false
jnlp.mixed.code=default
jnlp.offline-allowed=false
jnlp.signed=false
jnlp.signing=
jnlp.signing.alias=
jnlp.signing.keystore=

# =========================================================
# MAIN
# =========================================================

main.class=org.cine.system.Principal

# =========================================================
# MANIFEST
# =========================================================

manifest.custom.application.library.allowable.codebase=
manifest.custom.caller.allowable.codebase=
manifest.custom.codebase=
manifest.custom.permissions=
manifest.file=manifest.mf

meta.inf.dir=${src.dir}/META-INF

mkdist.disabled=false

platform.active=default_platform

# =========================================================
# RUN
# =========================================================

run.classpath=\
    ${javac.classpath}:\
    ${build.classes.dir}

run.jvmargs=--module-path "${javafx.lib.dir}" --add-modules javafx.controls,javafx.fxml

run.modulepath=\
    ${javac.modulepath}

run.test.classpath=\
    ${javac.test.classpath}:\
    ${build.test.classes.dir}

run.test.jvmargs=-Dcine.pruebas.bd=true

run.test.modulepath=\
    ${javac.test.modulepath}

# =========================================================
# SOURCE
# =========================================================

source.encoding=UTF-8

src.dir=src
test.src.dir=test